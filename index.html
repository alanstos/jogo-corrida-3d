<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0033" />
  <title>RETRO RACER 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Game-Over overlay — hidden by default, shown on state=GAME_OVER -->
  <div id="gameOver" class="overlay hidden" aria-hidden="true">
    <div class="overlay-inner">
      <h1 class="go-title">GAME OVER</h1>
      <p class="go-score">SCORE: <span id="goScoreValue">0</span></p>
      <button id="retryButton" type="button">RETRY</button>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
