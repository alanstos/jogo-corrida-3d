<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0033" />
  <title>RETRO RACER 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD: hidden during menu, shown on game.start() -->
  <div id="hud" class="hud hidden" aria-hidden="true">
    <div class="hud-cell hud-score">SCORE <span id="hudScore">0</span></div>
    <div class="hud-cell hud-speed">SPEED <span id="hudSpeed">0</span></div>
  </div>

  <!-- Touch controls: hidden during menu, shown on game.start() -->
  <div id="touchControls" class="touch-controls hidden" aria-hidden="false">
    <button id="btnLeft" class="touch-btn touch-btn-left" type="button" aria-label="Steer left">&#9664;</button>
    <button id="btnTurbo" class="touch-btn touch-btn-turbo" type="button" aria-label="Turbo boost">TURBO</button>
    <button id="btnRight" class="touch-btn touch-btn-right" type="button" aria-label="Steer right">&#9654;</button>
  </div>

  <!-- Menu overlay — visible on load (no .hidden), hidden when INICIAR pressed -->
  <div id="menu" class="overlay" aria-hidden="false">
    <div class="overlay-inner">
      <h1 class="menu-logo">RETRO RACER 3D</h1>
      <p id="menuRecord" class="menu-record hidden">RECORDE: <span id="menuRecordValue">0</span></p>
      <div id="difficultySelector" class="difficulty-selector">
        <button class="difficulty-btn" data-difficulty="facil" type="button">FÁCIL</button>
        <button class="difficulty-btn selected" data-difficulty="medio" type="button">MÉDIO</button>
        <button class="difficulty-btn" data-difficulty="dificil" type="button">DIFÍCIL</button>
      </div>
      <button id="btnIniciar" type="button">INICIAR</button>
    </div>
  </div>

  <!-- Game-Over overlay — hidden by default, shown on state=GAME_OVER -->
  <div id="gameOver" class="overlay hidden" aria-hidden="true">
    <div class="overlay-inner">
      <h1 class="go-title">GAME OVER</h1>
      <p class="go-score">SCORE: <span id="goScoreValue">0</span></p>
      <p id="goRecordBadge" class="go-record-badge hidden">NOVO RECORDE!</p>
      <p class="go-highscore">RECORDE: <span id="goHighScoreValue">0</span></p>
      <div class="go-buttons">
        <button id="retryButton" type="button">RETRY</button>
        <button id="menuButton" type="button">MENU</button>
      </div>
    </div>
  </div>

  <!-- Context-loss overlay — hidden by default, shown on webglcontextlost -->
  <div id="contextLoss" class="overlay hidden" aria-hidden="true">
    <div class="overlay-inner">
      <p class="ctx-loss-msg">TOQUE PARA RECARREGAR</p>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
